# 仅 local 环境使用用户提供的本机数据库凭据；云端使用 prod 环境变量。
spring:
  config:
    # local专用：支持从server目录或仓库根目录直接启动IDEA，不将密钥打进classpath。
    import:
      - optional:file:./.local/application-secrets.properties
      - optional:file:./cy-pregnancy-server/.local/application-secrets.properties
  datasource:
    password: ${DB_PASSWORD:root}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
