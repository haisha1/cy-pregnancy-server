spring:
  application:
    name: cy-pregnancy-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cy_pregnancy?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2s
  flyway:
    enabled: true
    clean-disabled: true
    # 不自动 baseline 已有库，避免把别的项目表误当成当前迁移基线。
    baseline-on-migrate: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
server:
  port: ${SERVER_PORT:18731}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    # 启动脚本在本机生成独立随机密钥；生产通过环境变量注入，不提供默认密钥。
    secret: ${JWT_SECRET:}
    issuer: cy-pregnancy
    access-seconds: 900
    refresh-seconds: 2592000
  wechat:
    app-id: ${WX_APP_ID:}
    secret: ${WX_APP_SECRET:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
